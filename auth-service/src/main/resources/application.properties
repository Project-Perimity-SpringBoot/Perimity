# Read .env from the repo root so STS behaves like Docker Compose.
# 'optional:' means the app still starts without it - which is how it runs in
# Docker and on AWS, where the values come from the environment instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# ============================================================
# PERIMITY - auth-service (Omkar)
# src/main/resources/application.properties
# ============================================================

spring.application.name=auth-service
server.port=8081

# ---------- Database ----------
# Same username/password for all 6 of us - this file is committed,
# so it must match everyone's Docker container.
spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
spring.datasource.username=perimity
spring.datasource.password=change_me_local_only

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- JWT (Day 3) ----------
# JWT_SECRET must be IDENTICAL in all 6 services or tokens issued
# here will not validate anywhere else.
perimity.jwt.secret=this_is_a_long_random_string_for_perimity_jwt
perimity.jwt.expiry-hours=24

# ---------- Internal service-to-service key ----------
perimity.internal.api-key=perimity_internal_key_local

# ---------- OTP policy (FR-REG-4 .. FR-REG-7) ----------
perimity.otp.length=6
perimity.otp.expiry-minutes=10
perimity.otp.max-attempts=5
perimity.otp.max-requests=3
perimity.otp.request-window-minutes=15

# ---------- Password policy (FR-SESS-6, FR-SESS-7) ----------
perimity.password.min-length=8
perimity.password.max-failed-attempts=5
perimity.password.lockout-minutes=15
perimity.password.reset-link-expiry-minutes=30

# ---------- Redis (Day 3 - lockout counters with TTL) ----------
# Uncomment when you add spring-boot-starter-data-redis to pom.xml
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------- SMTP (Day 9 - real OTP emails) ----------
# Uncomment when you add spring-boot-starter-mail to pom.xml.
# Use a Gmail App Password, NOT your real Gmail password.
# Google Account > Security > 2-Step Verification > App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=youraddress@gmail.com
spring.mail.password=your_16_char_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
perimity.mail.from-name=Perimity

# Dev switch - false logs the OTP/reset link to the console instead of
# sending. Flip to true once real MAIL_USERNAME/MAIL_PASSWORD are in .env.
perimity.mail.enabled=${MAIL_ENABLED:false}


# ---------- Password reset link target (Day 9) ----------
# The frontend doesn't exist yet (Day 13). Update this once it does - it
# becomes the page that reads ?token= and calls /password/reset-confirm.
perimity.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}


# ---------- Logging ----------
logging.level.com.perimity.auth=DEBUG

perimity.ratelimit.otp.per-email-per-hour=${RL_OTP_EMAIL:3}
perimity.ratelimit.otp.per-ip-per-hour=${RL_OTP_IP:10}
perimity.ratelimit.reset.per-email-per-day=${RL_RESET_EMAIL:3}
perimity.ratelimit.login.per-ip-per-hour=${RL_LOGIN_IP:30}

# ---------- Bulk limits (Day 10) ----------
# A second guard rail behind Tushar's, not a replacement. He rejects an oversized
# upload at the door using the campus's own configured limit; this caps what can
# arrive at the internal batch endpoints in one transaction.
perimity.bulk.max-rows=${BULK_MAX_ROWS:1000}