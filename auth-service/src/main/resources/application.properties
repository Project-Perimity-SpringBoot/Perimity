# Read .env from the repo root so STS behaves like Docker Compose.
# 'optional:' means the app still starts without it - which is how it runs in
# Docker and on AWS, where the values come from the environment instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# ============================================================
# PERIMITY - auth-service (Omkar)
# src/main/resources/application.properties
# ============================================================

spring.application.name=auth-service
server.port=8081

# ---------- Database ----------
# Same username/password for all 6 of us - this file is committed,
# so it must match everyone's Docker container.
spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
spring.datasource.username=perimity
spring.datasource.password=change_me_local_only

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- JWT (Day 3) ----------
# JWT_SECRET must be IDENTICAL in all 6 services or tokens issued
# here will not validate anywhere else.
# Was a literal. auth-service ISSUES the tokens every other service validates,
# so a literal here meant everything it signed failed everywhere else. The
# comment above was already right; the value was not.
perimity.jwt.secret=${JWT_SECRET}
perimity.jwt.expiry-hours=24

# ---------- Internal service-to-service key ----------
# Same fix. Every other service sends INTERNAL_API_KEY from .env, so a literal
# here rejected all of them - including callers of the Day 10 batch endpoints.
perimity.internal.api-key=${INTERNAL_API_KEY}

# PROPOSAL. gatepass-service, for the visitor OTP confirmation.
# Container name in Docker (compose sets GATEPASS_BASE_URL); localhost for an
# STS run, which is what the default here is for.
perimity.gatepass.base-url=${GATEPASS_BASE_URL:http://localhost:8083}

# ---------- OTP policy (FR-REG-4 .. FR-REG-7) ----------
perimity.otp.length=6
perimity.otp.expiry-minutes=10
perimity.otp.max-attempts=5
perimity.otp.max-requests=3
perimity.otp.request-window-minutes=15

# ---------- Password policy (FR-SESS-6, FR-SESS-7) ----------
perimity.password.min-length=8
perimity.password.max-failed-attempts=5
perimity.password.lockout-minutes=15
perimity.password.reset-link-expiry-minutes=30

# ---------- Redis (Day 3 - lockout counters with TTL) ----------
# Uncomment when you add spring-boot-starter-data-redis to pom.xml
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------- SMTP (Day 9 - real OTP emails) ----------
# MailHog by default, matching qr-service. It is already running in
# docker-compose, it accepts anything, delivers to nobody, and shows the result
# at http://localhost:8025 - so the OTP flow is demonstrable without a Gmail
# App Password, and a bulk run cannot email 600 real strangers by accident.
# SES uses this same block on Day 22.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Timeouts, which this file did not have and qr-service always did.
#
# Without them JavaMail waits forever on a connect. Against MailHog on the same
# network that never mattered; against a real SMTP host on a flaky link it
# means a send hangs for minutes and the pool thread is held the whole time,
# and the error - when it finally arrives - reads "timeout -1", which is
# JavaMail saying it was never given one.
#
# Five seconds is long enough for a real handshake and short enough that a
# dropped connection fails while the guard is still looking at the screen.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

perimity.mail.from-name=${MAIL_FROM_NAME:Perimity}

perimity.mail.enabled=${MAIL_ENABLED:true}


# ---------- Password reset link target (Day 9) ----------
# The frontend doesn't exist yet (Day 13). Update this once it does - it
# becomes the page that reads ?token= and calls /password/reset-confirm.
perimity.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}


# ---------- Logging ----------
logging.level.com.perimity.auth=DEBUG

perimity.ratelimit.otp.per-email-per-hour=${RL_OTP_EMAIL:3}
perimity.ratelimit.otp.per-ip-per-hour=${RL_OTP_IP:10}
perimity.ratelimit.reset.per-email-per-day=${RL_RESET_EMAIL:3}
perimity.ratelimit.login.per-ip-per-hour=${RL_LOGIN_IP:30}

# ---------- Bulk limits (Day 10) ----------
# A second guard rail behind Tushar's, not a replacement. He rejects an oversized
# upload at the door using the campus's own configured limit; this caps what can
# arrive at the internal batch endpoints in one transaction.
perimity.bulk.max-rows=${BULK_MAX_ROWS:1000}
# =========================================================
#         SERVICE DISCOVERY  -  Eureka client
# =========================================================
# The service registers under spring.application.name, which is already set
# above. Feign then resolves @FeignClient(name = "campus-service") through the
# registry, so no URL appears in the code.
#
# ENABLED=false is a first-class option, not a bug workaround. With it off the
# service behaves exactly as it did before Eureka existed and falls back to the
# plain <PEER>_SERVICE_URL properties. That means the registry being down never
# stops the platform, and a teammate can run one service without starting it.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Register by IP rather than hostname. On a laptop the hostname often does not
# resolve from another process, and the registry then holds an address nobody
# can reach.
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}

# Faster than the 30s default, so a service you just started appears in the
# dashboard while you are still looking at it. Leave the defaults in production.
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Eureka is chatty. This keeps the console readable.
logging.level.com.netflix.discovery=WARN

# =========================================================
#   RABBITMQ - publishes user.created
#
# auth-service had never spoken to the broker before this. It does now for one
# reason: a new STUDENT or FACULTY account needs a matching profile in
# user-service, and that used to be a second API call made by the browser. Any
# account whose second call did not happen could sign in with no profile, and
# nothing in the product could create one afterwards.
#
# See UserEventPublisher for why a broker failure does not fail account
# creation.
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Retry a publish through a broker blip rather than losing the event on the
# first refused connection.
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=500ms
spring.rabbitmq.template.retry.max-attempts=3

# Where a bulk-imported student is told to sign in. Same shape as the reset URL
# above - localhost for development, the deployed origin in .env for anything
# else. A welcome email pointing at localhost is a welcome email nobody can use.
perimity.frontend.login-url=${FRONTEND_LOGIN_URL:http://localhost:5173/login}

# Where a VISITOR signs in. Deliberately not the same page: a visitor has
# no password, so the password form would be a dead end for them. This is
# the "sign in with an email code" page.
perimity.frontend.visitor-login-url=${FRONTEND_VISITOR_LOGIN_URL:http://localhost:5173/login/code}

# Comma-separated. Add a LAN address or a deployed URL here rather than
# editing SecurityConfig - see the note on corsSource().
perimity.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
