# =========================================================
# 					QR SERVICE
# =========================================================

# Reads the repo-root .env, matching gatepass-service. Adopted from Tushar's
# pack: without it every teammate has to add QR_AES_KEY and INTERNAL_API_KEY to
# their own IDE run configuration by hand, and the first person who forgets gets
# "Could not resolve placeholder" with nothing pointing at the cause.
# 'optional:' keeps the app starting when .env is absent, which is how it runs
# in Docker and on AWS where the values come from the environment.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.application.name=qr-service
server.port=8086


# =========================================================
# 				POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/qrdb
spring.datasource.username=perimity
spring.datasource.password=change_me_local_only

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# 					JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# 					SWAGGER / OPENAPI
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


# =========================================================
# 			ERROR DETAILS - DEVELOPMENT ONLY
# =========================================================

server.error.include-message=always
server.error.include-binding-errors=always
# QR token signing key - 32 bytes, Base64. Never commit the value.
qr.token.secret=${QR_AES_KEY:}


qr.internal.api-key=${INTERNAL_API_KEY:}
qr.storage.type=local
qr.storage.local.root=./storage


# =========================================================
# 					RABBITMQ  (Day 8)
# =========================================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# One consumer, one unacknowledged message at a time.
# Day 10 raises both under the throughput task. Until then, single-threaded
# consumption is what makes GenerationJobService.claim correct without any
# locking: two consumers could otherwise claim two messages for the same pass
# at the same moment, and both would generate.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.prefetch=1

# auto: the container acknowledges only after the listener method returns
# normally. That is what "we acknowledge a message only after the job
# completes" in the roadmap actually means - kill the service mid-generation
# and the broker redelivers the message rather than losing the pass.
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# false is the single most important line in this block. Left at the default
# true, a message that always fails is requeued instantly and forever - it
# pins a CPU core, floods the log, and blocks the queue behind it. It looks
# exactly like RabbitMQ being broken. With false, a rejected message follows
# the queue's dead-letter arguments to qr.generate.dlq.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

# Publisher confirms. Without these, convertAndSend can hand a message to a
# broker that accepts the TCP write and then loses it, and nothing throws - so
# the failure is invisible on both sides. Turned on here for the result queue;
# gatepass-service needs the same two lines for the job queue.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Publish retry, so a broker blip does not lose a result that the job row has
# already committed as DONE.
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=500ms
spring.rabbitmq.template.retry.max-attempts=3


# =========================================================
# 					EMAIL  (Day 9)
# =========================================================

# MailHog by default, not Gmail. A development run that sends real email to
# real addresses is a mistake you only get to make once, and a bulk upload of
# 600 rows makes it 600 times. MailHog accepts everything and shows it at
# http://localhost:8025 without delivering anything.
#
# SES uses this same block on Day 22 - email-smtp.<region>.amazonaws.com on
# port 587, with SMTP credentials generated in the SES console (which are NOT
# the same as an AWS access key), auth true and STARTTLS true.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Bounded, for the same reason as the gatepass timeouts on Day 8: this runs on
# the queue consumer thread. An unbounded write timeout means one unresponsive
# mail server stops all QR generation, and nothing in any log says why.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# The sender. On SES this MUST be a verified identity or every send is rejected
# - and verifying a domain takes DNS propagation time, so it is a Day 8-9 task,
# not a Day 22 one.
qr.email.from=${MAIL_FROM:no-reply@example.com}
qr.email.from-name=${MAIL_FROM_NAME:Perimity}
