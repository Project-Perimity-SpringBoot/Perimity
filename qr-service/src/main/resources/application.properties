# =========================================================
# 					QR SERVICE
# =========================================================

spring.application.name=qr-service
server.port=8086


# =========================================================
# 				POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/qrdb
spring.datasource.username=perimity
spring.datasource.password=change_me_local_only

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# 					JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# 					SWAGGER / OPENAPI
# =========================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


# =========================================================
# 			ERROR DETAILS - DEVELOPMENT ONLY
# =========================================================

server.error.include-message=always
server.error.include-binding-errors=always
# QR token signing key - 32 bytes, Base64. Never commit the value.
qr.token.secret=${QR_AES_KEY:}


qr.internal.api-key=${INTERNAL_API_KEY:}
qr.storage.type=local
qr.storage.local.root=./storage
