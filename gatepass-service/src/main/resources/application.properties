
# =========================================================
#   Read .env from the repo root, so STS behaves like Docker
# =========================================================
# Docker Compose reads .env automatically; STS does not. Without this line
# every teammate has to add JWT_SECRET and INTERNAL_API_KEY by hand to their
# own Run Configuration, and the first person who forgets gets
# "Could not resolve placeholder" with no clue why.
#
# 'optional:' means the app still starts if .env is absent - which is how it
# will run in Docker and on AWS, where the values come from the environment.
# The [.properties] suffix tells Spring to parse an extension-less file as
# key=value properties.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.application.name=gatepass-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/gatepassdb
spring.datasource.username=perimity
spring.datasource.password=change_me_local_only

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
#              SECURITY  -  Day 7
# =========================================================
# NO DEFAULT on either, deliberately. If the variable is missing the service
# refuses to start. A fallback here is how a secret ends up committed.
#
# JWT_SECRET must be IDENTICAL in all six services or tokens issued by
# auth-service will not verify here.
perimity.jwt.secret=${JWT_SECRET}

# Protects /api/gatepass/internal/** - service-to-service only.
perimity.internal.api-key=${INTERNAL_API_KEY}

# =========================================================
#              MESSAGING  -  Day 8
# =========================================================
# HOSTS ARE LOCAL HERE, AND THAT IS DELIBERATE.
#
# .env carries CONTAINER names - RABBITMQ_HOST=rabbitmq, REDIS_HOST=redis -
# because docker-compose.yml needs them. Since this file now imports .env for
# the secrets, referencing ${RABBITMQ_HOST} here would drag the container name
# into an STS run, where "rabbitmq" does not resolve and the app retries
# forever with "Failed to check/redeclare auto-delete queue(s)".
#
# So: localhost for local runs, and Docker overrides it with the standard
# SPRING_RABBITMQ_HOST environment variable, which Spring's relaxed binding
# maps to this property at a HIGHER precedence than this file.
#
#   docker-compose.yml:
#     environment:
#       SPRING_RABBITMQ_HOST: rabbitmq
#
# Rule of thumb: .env is for SECRETS. Hostnames belong to the runtime.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Retry a publish that cannot reach the broker, then give up rather than
# blocking the request thread forever.
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=500ms
spring.rabbitmq.template.retry.max-attempts=3

# Consumer retry. After this the message goes to the dead-letter queue instead
# of being redelivered forever - a poison message must not spin at 100% CPU.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =========================================================
#        INTERNAL SERVICE URLS  -  Day 8
# =========================================================
# Docker Compose DNS resolves the service names. No Eureka, no gateway - at six
# services the registry costs more than it saves.
perimity.services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
perimity.services.user-url=${USER_SERVICE_URL:http://localhost:8082}
perimity.services.campus-url=${CAMPUS_SERVICE_URL:http://localhost:8084}
perimity.services.timeout-ms=${INTERNAL_TIMEOUT_MS:3000}

# =========================================================
#              OBJECT STORAGE  -  Day 10
# =========================================================
# Copied from campus-service (Arham), which is the reference implementation.
# Same property NAMES on purpose - six services with six different spellings
# of "where do files go" is how a deployment goes wrong at 2am.
#
# LOCAL IS THE DEFAULT, deliberately. Nobody should need an AWS account, a
# credential file or a network connection to run this project. On Day 22 one
# property flips to s3 and no Java changes.
perimity.storage.type=${STORAGE_TYPE:local}
perimity.storage.local-dir=${STORAGE_LOCAL_DIR:./storage-dev}

perimity.storage.bucket=${AWS_S3_BUCKET:perimity-bucket}
perimity.storage.region=${AWS_REGION:ap-south-1}

# How long an errors.csv download link stays alive. Short on purpose: a link
# that leaks stops working in minutes rather than never.
perimity.storage.presign-minutes=${STORAGE_PRESIGN_MINUTES:15}

# Largest spreadsheet accepted, in MB.
#
# This is a FILE SIZE guard and it is a different thing from the ROW limit.
# The row limit is per-campus POLICY read from campus-service
# (bulk.upload.max.rows, which Arham seeds at 1000). This is a crude guard so
# a 200 MB file never reaches Apache POI at all - POI loads an xlsx into heap,
# so an unbounded upload is an OutOfMemoryError with extra steps.
perimity.storage.max-sheet-mb=${UPLOAD_MAX_SHEET_MB:5}

# Spring's own multipart ceiling. MUST be >= max-sheet-mb, or Spring rejects
# the upload before BulkUploadService ever runs and the user gets an opaque
# 500 instead of "the sheet must be smaller than 5 MB". Set higher so OUR
# message is the one they read.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
