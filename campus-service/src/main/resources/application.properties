# =========================================================
#                    CAMPUS SERVICE
# =========================================================
spring.application.name=campus-service
server.port=8084

# =========================================================
#   POSTGRESQL  -  values come from the environment.
#   docker-compose injects SPRING_DATASOURCE_* from .env.
#   The values after ":" are local-development fallbacks only,
#   so the service still boots when launched from the IDE.
#   Never put a real credential in this file.
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/campusdb
spring.datasource.username=perimity
spring.datasource.password=change_me_local_only
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
#                    JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
#                   SWAGGER / OPENAPI
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
#            ERROR DETAIL  -  DEVELOPMENT ONLY
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

