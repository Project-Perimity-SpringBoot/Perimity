# Read .env from the repo root so STS behaves like Docker Compose.
# 'optional:' means the app still starts without it - which is how it runs in
# Docker and on AWS, where the values come from the environment instead.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# =========================================================
#                    CAMPUS SERVICE
# =========================================================
spring.application.name=campus-service
server.port=8084

# =========================================================
#   POSTGRESQL  -  values come from the environment.
#   docker-compose injects SPRING_DATASOURCE_* from .env.
#   The values after ":" are local-development fallbacks only,
#   so the service still boots when launched from the IDE.
#   Never put a real credential in this file.
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/campusdb
spring.datasource.username=perimity
spring.datasource.password=change_me_local_only
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
#                    JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
#                   SWAGGER / OPENAPI
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
#            ERROR DETAIL  -  DEVELOPMENT ONLY
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
#   DAY 3 ONWARDS - uncomment as you implement each piece.
#
# internal.api-key=${INTERNAL_API_KEY}
#
# aws.s3.bucket=${S3_BUCKET:perimity-bucket}
# aws.s3.region=${AWS_REGION:ap-south-1}
# =========================================================

# =========================================================
#              SECURITY  -  Day 7
# =========================================================
# No defaults, deliberately. A missing secret must stop the service, not fall
# back to a value someone can find in git history.
perimity.jwt.secret=${JWT_SECRET}
perimity.internal.api-key=${INTERNAL_API_KEY}

# =========================================================
#              STORAGE  -  Day 9
# =========================================================
# local = write to a folder on disk. The default, so the project runs with no
#         AWS account, no credentials and no network.
# s3    = the real thing. Switch on Day 22 by setting one property.
perimity.storage.type=${STORAGE_TYPE:local}
perimity.storage.local-dir=${STORAGE_LOCAL_DIR:./storage-dev}

perimity.storage.bucket=${AWS_S3_BUCKET:perimity-bucket}
perimity.storage.region=${AWS_REGION:ap-south-1}
# Credentials are NOT read from properties. The SDK's default chain finds them
# from the environment locally and from the IAM role on EC2 - which means no
# access key is ever written down. See the S3 guide.

perimity.storage.max-logo-mb=${UPLOAD_MAX_LOGO_MB:2}
perimity.storage.presign-minutes=${STORAGE_PRESIGN_MINUTES:15}

# Multipart limits. Spring rejects anything larger before your code runs.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================================================
#         SERVICE DISCOVERY  -  Eureka client
# =========================================================
# The service registers under spring.application.name, which is already set
# above. Feign then resolves @FeignClient(name = "campus-service") through the
# registry, so no URL appears in the code.
#
# ENABLED=false is a first-class option, not a bug workaround. With it off the
# service behaves exactly as it did before Eureka existed and falls back to the
# plain <PEER>_SERVICE_URL properties. That means the registry being down never
# stops the platform, and a teammate can run one service without starting it.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Register by IP rather than hostname. On a laptop the hostname often does not
# resolve from another process, and the registry then holds an address nobody
# can reach.
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}

# Faster than the 30s default, so a service you just started appears in the
# dashboard while you are still looking at it. Leave the defaults in production.
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Eureka is chatty. This keeps the console readable.
logging.level.com.netflix.discovery=WARN
