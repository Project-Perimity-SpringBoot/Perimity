# Test profile. H2 in PostgreSQL compatibility mode and local storage, so a
# context test needs no container, no Postgres and no AWS account - and CI can
# compile-check this service without starting Docker.
#
# create-drop, not update: a test must never inherit a schema left behind by an
# earlier run, or a passing test can be passing for the wrong reason.
spring.datasource.url=jdbc:h2:mem:userdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Long enough to satisfy the 32-character HS256 check in JwtService.
perimity.jwt.secret=test_only_secret_that_is_definitely_long_enough_1234
perimity.cors.allowed-origins=http://localhost:3000

# Empty on purpose: the pass-pause client resolves to the logged no-op, so no
# test ever tries to reach a gatepass container that is not running.
# Blank on purpose: the pass-pause client resolves to the logged no-op, so no
# test tries to reach a gatepass container that is not running. Since Day 12 the
# main profile defaults this to localhost:8083, so a test MUST blank it
# explicitly rather than relying on it being unset.
perimity.services.gatepass-url=
perimity.services.timeout-ms=1000

# Mandatory since Day 12 - InternalApiKeyFilter refuses to start without it.
perimity.internal.api-key=test_internal_key

# Under target/, so `mvn clean` removes anything a test wrote.
perimity.storage.type=local
perimity.storage.local-dir=./target/storage-test
perimity.storage.max-photo-mb=2
perimity.storage.max-document-mb=5
perimity.storage.presign-minutes=15

# perimity.storage.bucket and .region are deliberately absent. They are read
# only by S3StorageService, which @ConditionalOnProperty leaves uncreated while
# type=local - so the placeholders are never resolved. Setting type=s3 here
# would fail loudly at startup, which is the correct outcome.
