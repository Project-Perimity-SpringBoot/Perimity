spring.config.import=optional:file:../.env[.properties]

# =========================================================
#                     USER SERVICE
# =========================================================
spring.application.name=user-service
server.port=8082

# =========================================================
#   POSTGRESQL
#
#   Every value below reads an environment variable first and
#   falls back to a local-development value only so the service
#   still boots when launched from STS with nothing exported.
#   docker-compose injects the real SPRING_DATASOURCE_* from .env.
#
#   Port is 5432, not 5433. All five Perimity databases live on
#   ONE Postgres container in development.
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:perimity}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_local_only}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
#                       FLYWAY
# =========================================================
# Migrations run at startup, before Hibernate looks at the schema.
#
# WHY THIS EXISTS: ddl-auto=update only ever ADDS. It cannot drop a column, it
# cannot add a NOT NULL column to a table that has rows, and when it fails it
# logs a WARNING and lets the service start. Both of those have already cost
# this project a day:
#
#   * verification_status was never created. Every read failed against a
#     service that reported itself healthy.
#   * host_user_id could not be dropped. Every new visitor request 500'd until
#     someone ran ALTER TABLE by hand, on each machine separately.
#
# baseline-on-migrate is what makes this safe to add to a running project. A
# database that already has these tables is stamped as version 1 and V1 is NOT
# executed against it. Only an empty database runs V1 and builds the schema
# from scratch. Everything from V2 onward runs everywhere, exactly once, in
# order, on every machine - which is the property ddl-auto never had.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema as built by ddl-auto

# =========================================================
#                    JPA / HIBERNATE
# =========================================================
# STILL update, NOT validate - deliberately, and temporarily.
#
# validate is where this ends up: it fails startup when the entities and the
# schema disagree, which turns silent drift into a loud error. It is not set
# today because every teammate's database was built by ddl-auto and they have
# drifted differently, so flipping this would break their machines rather than
# this one. Change it once everyone has recreated their database from V1.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
#                   SWAGGER / OPENAPI
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
#            ERROR DETAIL  -  DEVELOPMENT ONLY
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
#   DAY 7 - SECURITY
#
#   perimity.jwt.secret MUST be byte-identical to the value
#   auth-service uses, or every token issued there fails its
#   signature check here and every caller simply looks logged
#   out. Both read JWT_SECRET from the repo-root .env.
#
#   The fallback below matches what auth-service currently has
#   committed, so the two agree out of the box on a fresh clone.
#   It is a DEVELOPMENT value and nothing more - set JWT_SECRET
#   in .env before anything is deployed and the fallback stops
#   being used.
#
#   There is deliberately no expiry setting here. Only the
#   service that ISSUES a token decides how long it lives; this
#   one just honours the exp claim already inside it.
# =========================================================
perimity.jwt.secret=${JWT_SECRET:this_is_a_long_random_string_for_perimity_jwt}

# Origins allowed to call this service from a browser, comma separated.
# Vite and CRA dev servers. Replace with the real frontend origin on Day 22 -
# a wildcard is rejected by browsers when credentials are allowed.
perimity.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# =========================================================
#   SERVICE-TO-SERVICE
#
#   DAY 12 FIX. This was perimity.gatepass.base-url with an EMPTY
#   default and its own GATEPASS_BASE_URL environment variable.
#   Two things were wrong with that:
#
#     1. Empty meant the pass-pause call resolved to the no-op
#        client, so editing a sensitive profile field logged a
#        warning and left the pass ACTIVE. The Day 12 happy path
#        expects it to go PAUSED. It failed silently and looked
#        like nothing had happened, because nothing had.
#
#     2. Every other service reads <PEER>_SERVICE_URL. Setting
#        GATEPASS_SERVICE_URL in the shared .env - the obvious
#        thing to do - configured five services and not this one.
#
#   Now matches the convention used by gatepass and guard:
#   perimity.services.<peer>-url, <PEER>_SERVICE_URL, and a
#   localhost default that works out of the box.
#
#     compose  http://gatepass-service:8080
#
#   Blank it deliberately to run user-service alone; the client
#   still falls back to the logged no-op.
#
#   That endpoint is INTERNAL on gatepass-service's side, so the
#   call carries INTERNAL_API_KEY rather than a JWT.
#
#   INTERNAL_API_KEY now has NO default, matching auth, gatepass
#   and campus. A missing key used to let the service start and
#   then refuse every internal call with a 401 - which reads as
#   "gatepass cannot reach user-service" rather than "you forgot
#   a variable". Failing at startup names the actual problem.
# =========================================================
perimity.services.gatepass-url=${GATEPASS_SERVICE_URL:http://localhost:8083}

# Bulk student onboarding asks auth-service to create the accounts - it is the
# only service allowed to write a users row. See AuthFeignClient.
#
# Both names are read. docker-compose sets AUTH_SERVICE_URL for gatepass-service
# already, so that is the name the repo has settled on; AUTH_BASE_URL is
# accepted because the gatepass client next door reads GATEPASS_SERVICE_URL
# while compose sets GATEPASS_BASE_URL, and nobody noticed because Eureka
# resolves the name anyway and the url attribute is only a fallback. Accepting
# both here means the fallback works whichever name is set.
perimity.services.auth-url=${AUTH_SERVICE_URL:${AUTH_BASE_URL:http://localhost:8081}}

perimity.services.timeout-ms=${INTERNAL_TIMEOUT_MS:3000}

# =========================================================
#   GOOGLE DRIVE - passport photos from the intake form
#
# Defaults to OFF. Anyone who does not need bulk onboarding should never have
# to obtain a service-account key to run this service, and a Drive outage must
# delay passes rather than fail an intake - so "off" and "unreachable" behave
# identically: the import runs, photos are skipped, students are prompted to
# upload one when they sign in.
#
# The credentials path points INSIDE the container. docker-compose mounts the
# real key there read-only from wherever the developer keeps it.
# =========================================================
perimity.google.drive-enabled=${GOOGLE_DRIVE_ENABLED:false}
perimity.google.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}

# The country code applied when the form has no column for one. Configured
# rather than hard-coded: a campus-agnostic product cannot assume +91, but a
# single-country intake reasonably will.
perimity.import.default-country-code=${IMPORT_DEFAULT_COUNTRY_CODE:+91}
perimity.internal.api-key=${INTERNAL_API_KEY}

# =========================================================
#   DAY 9 - OBJECT STORAGE
#
#   local = a folder on disk. THE DEFAULT, so this service runs
#           with no AWS account, no credentials and no network.
#   s3    = the real thing. Switch on Day 22 by setting one
#           property; no code changes.
#
#   Same property names as campus-service, which is where this
#   storage package was copied from. Keeping them identical means
#   one .env line configures every service that stores files.
# =========================================================
perimity.storage.type=${STORAGE_TYPE:local}
perimity.storage.local-dir=${STORAGE_LOCAL_DIR:./storage-dev}

perimity.storage.bucket=${AWS_S3_BUCKET:perimity-bucket}
perimity.storage.region=${AWS_REGION:ap-south-1}
# Credentials are NOT read from properties. The SDK's default chain finds them
# from the environment locally and from the IAM role on EC2 - which means no
# access key is ever written down, and none can be committed by accident.

# Upload limits, enforced in UploadValidator against the file's REAL leading
# bytes, not the content type the browser claimed.
perimity.storage.max-photo-mb=${UPLOAD_MAX_PHOTO_MB:2}
perimity.storage.max-document-mb=${UPLOAD_MAX_DOCUMENT_MB:5}

# How long a presigned read link lives. Short on purpose: what these links point
# at is somebody's photograph or identity document, and a link that leaks should
# stop working in minutes rather than never.
perimity.storage.presign-minutes=${STORAGE_PRESIGN_MINUTES:15}

# Multipart limits. Spring rejects anything larger BEFORE any controller runs,
# which is why GlobalExceptionHandler catches MaxUploadSizeExceededException -
# otherwise the friendly per-file message never gets the chance to fire.
# Set above the document cap so the service layer produces the error, not Tomcat.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# =========================================================
#   RABBITMQ - consumes user.created to provision profiles
#
# Defaults match the other services: guest/guest is what the local broker
# ships with, and .env overrides it everywhere that matters.
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Retry a failed provisioning three times with backoff before dead-lettering.
# A transient database blip should not cost somebody their profile, and a
# message that always fails must not be redelivered forever - it would pin a
# consumer and starve everything behind it. Same settings as qr-service.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

# One consumer is plenty. Provisioning is a single insert, and account creation
# is not a high-volume path.
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.prefetch=4

# =========================================================
#                       LOGGING
# =========================================================
logging.level.com.perimity.user=DEBUG

# =========================================================
#         SERVICE DISCOVERY  -  Eureka client
# =========================================================
# The service registers under spring.application.name, which is already set
# above. Feign then resolves @FeignClient(name = "campus-service") through the
# registry, so no URL appears in the code.
#
# ENABLED=false is a first-class option, not a bug workaround. With it off the
# service behaves exactly as it did before Eureka existed and falls back to the
# plain <PEER>_SERVICE_URL properties. That means the registry being down never
# stops the platform, and a teammate can run one service without starting it.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Register by IP rather than hostname. On a laptop the hostname often does not
# resolve from another process, and the registry then holds an address nobody
# can reach.
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}

# Faster than the 30s default, so a service you just started appears in the
# dashboard while you are still looking at it. Leave the defaults in production.
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Eureka is chatty. This keeps the console readable.
logging.level.com.netflix.discovery=WARN

# =========================================================
#         FEIGN  -  declarative peer calls
# =========================================================
# Which client implementation is live. Both are present; this chooses.
#   http   RestClient, the original. Still the default.
#   feign  the Feign implementation, resolved through Eureka.
# One property, and rollback is changing it back.
perimity.clients.mode=${CLIENTS_MODE:http}

# Timeouts. Feign's defaults are 10s connect and 60s read, which is far too
# long for a call that only enriches a QR job - it would hold a request thread
# for a minute while a peer is restarting.
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Required for the 'fallback' attribute on @FeignClient to be honoured. Without
# this Feign throws on failure and the fail-soft behaviour is silently lost.
spring.cloud.openfeign.circuitbreaker.enabled=true

# =========================================================
#   THE STUDENT IMPORT CALL NEEDS ITS OWN TIMEOUTS
#
# The 3s default above is right for pausing a pass - one row, one update. It is
# badly wrong for this one.
#
# Creating accounts means bcrypt-hashing a password PER STUDENT, and bcrypt is
# deliberately slow: roughly 100ms each. Two hundred students is twenty seconds
# of hashing before auth-service even answers. At 3s the call times out, the
# batch is marked FAILED, and the accounts may have been created anyway - the
# worst outcome available, because a retry would then find them all REUSED and
# the operator would have no idea whether the first attempt worked.
#
# 120s covers a full 1000-row batch (BULK_MAX_ROWS) with room to spare.
#
# The key is the contextId on @FeignClient, not the service name - two clients
# pointing at the same service need separate configs, and contextId is what
# distinguishes them.
# =========================================================
spring.cloud.openfeign.client.config.userStudentImport.connectTimeout=5000
spring.cloud.openfeign.client.config.userStudentImport.readTimeout=120000

# =========================================================
#   THE TIME LIMITER, WHICH IS WHAT ACTUALLY BROKE THE FIRST IMPORT
#
# resilience4j's TimeLimiter defaults to ONE SECOND when nothing configures it.
# With circuitbreaker.enabled=true every Feign call runs under it, so the very
# first student import was cancelled at 1s and reported as
# "No fallback available" - a message that says nothing about a timeout and
# sent us looking at Eureka and API keys instead.
#
# Set on `configs.default` rather than per instance on purpose. Spring Cloud
# OpenFeign names each breaker after the METHOD SIGNATURE, not the contextId -
# something like AuthFeignClient#createStudents(StudentBatchRequest) - so
# instance-keyed config silently fails to apply and the 1s default stays. That
# is the same class of bug as the one it would be trying to fix: configuration
# that looks correct and does nothing.
#
# Letting the limiter be generous is safe because FEIGN owns the real timeouts,
# per client, above. The pass-pause client still gives up after its own 3s; the
# limiter simply stops cancelling calls before their own deadline.
# =========================================================
resilience4j.timelimiter.configs.default.timeoutDuration=130s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true

resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=60
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=20s
