# Perimity â€” local development stack.
#
# Reads values from .env in this folder. Copy .env.example to .env first.
#
#   cp .env.example .env
#   docker compose up --build
#
# The `version:` key was removed â€” Compose v2 ignores it and warns about it.
services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16
    container_name: perimity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates authdb, userdb, gatepassdb, campusdb, qrdb on first startup.
      # Without this, every service fails with "database ... does not exist".
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:7
    container_name: perimity-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management
    container_name: perimity-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: perimity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailhog:
    image: mailhog/mailhog:latest
    container_name: perimity-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 3s
      retries: 5
  # ---------- Application services ----------
#
# Paste these UNDER the existing infra services (postgres, mongo, rabbitmq,
# redis, mailhog) and DELETE the six commented-out blocks currently there.
#
# Two things differ from those commented blocks, both deliberate:
#
#  1. Ports map 8081:8081, not 8081:8080. Every service sets its own
#     server.port in application.properties (8081..8086). The old mapping
#     assumed 8080 inside the container, so nothing would have answered.
#
#  2. Service URLs use CONTAINER NAMES, not localhost. Inside the compose
#     network `localhost` is the container itself, so every cross-service call
#     would have connected to nothing. This is the single most common reason a
#     stack that works in an IDE fails in Docker.
#
# env_file supplies JWT_SECRET, INTERNAL_API_KEY, QR_AES_KEY and the database
# credentials from the repo-root .env, so no secret appears below.
# ============================================================================

  # ---------- Service discovery ----------
  #
  # Added Day 13. Every service registers here and Feign resolves by service
  # name instead of URL. Note this is NOT what makes cross-service calls work in
  # Docker - compose DNS already resolves container names - so if Eureka is down
  # the http client mode below still functions. That is deliberate: the registry
  # is an addition, not a single point of failure.
  discovery-server:
    build: ./discovery-server
    container_name: perimity-discovery
    restart: unless-stopped
    env_file: .env
    ports: ["8761:8761"]
    healthcheck:
      # The Eureka dashboard, not /actuator/health.
      #
      # discovery-server/pom.xml declares only
      # spring-cloud-starter-netflix-eureka-server - there is no
      # spring-boot-starter-actuator on its classpath, so the
      # management.endpoints.web.exposure.include=health,info line in its
      # properties has nothing to expose and /actuator/health 404s.
      #
      # A healthcheck that can never pass leaves this container permanently
      # "starting", and every service below declares
      # `depends_on: discovery-server: service_healthy` - so the whole stack
      # would wait on it forever. "/" serves the dashboard and works whether or
      # not actuator is ever added.
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  auth-service:
    build: ./auth-service
    container_name: perimity-auth
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      # Container name, not localhost. auth-service publishes user.created here
      # so user-service can provision the profile for a new STUDENT or FACULTY.
      RABBITMQ_HOST: rabbitmq
      # MailHog unless SMTP_* is set in .env. Deliberately NOT MAIL_HOST from
      # .env: that one is localhost for an STS run, which inside a container
      # means the container itself. Same split as SPRING_RABBITMQ_HOST above.
      # To send real mail, set SMTP_HOST/SMTP_PORT/SMTP_AUTH/SMTP_STARTTLS plus
      # MAIL_USERNAME and MAIL_PASSWORD in .env, then recreate this service.
      MAIL_HOST: ${SMTP_HOST:-mailhog}
      MAIL_PORT: ${SMTP_PORT:-1025}
      MAIL_SMTP_AUTH: "${SMTP_AUTH:-false}"
      MAIL_STARTTLS: "${SMTP_STARTTLS:-false}"
      # PROPOSAL. Container name, not localhost - see GatepassVisitorClient.
      GATEPASS_BASE_URL: http://gatepass-service:8083
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports: ["8081:8081"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      # service_started, NOT service_healthy, and the difference matters.
      #
      # auth-service publishes user.created but does not need the broker to do
      # its job: UserEventPublisher swallows a publish failure precisely so a
      # RabbitMQ hiccup cannot fail account creation. Waiting for the broker to
      # be HEALTHY before starting would undo that at the other end - a broken
      # RabbitMQ would stop auth-service booting, and nobody could sign in to
      # anything. Login must not depend on a message queue.
      rabbitmq: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/auth/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  user-service:
    build: ./user-service
    container_name: perimity-user
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      # GATEPASS_SERVICE_URL, from main, and it is a fix rather than a rename
      # for its own sake: user-service reads ${GATEPASS_SERVICE_URL} while this
      # file used to set GATEPASS_BASE_URL. The two never matched, and nothing
      # broke only because Eureka resolves the service by name and the url
      # property is just a fallback - so it would have bitten the first person
      # to run with EUREKA_ENABLED=false.
      GATEPASS_SERVICE_URL: http://gatepass-service:8083
      # Bulk student onboarding asks auth-service to create the accounts.
      # Container name, not localhost - inside a container localhost is the
      # container itself.
      AUTH_SERVICE_URL: http://auth-service:8081
      # Google Drive - fetches passport photos submitted through the intake
      # form. The key is mounted read-only from a path OUTSIDE the repo; only
      # its location is configured here, never its contents.
      #
      # Set GOOGLE_DRIVE_ENABLED=false in .env to run the whole import without
      # Drive. Students then import without photos and are prompted for one in
      # the app, which is also what happens if Drive is unreachable - an outage
      # must delay passes, not strand an intake.
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-true}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-drive.json
      STORAGE_LOCAL_DIR: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
      # The service-account key, read-only, from wherever the developer keeps
      # it. GOOGLE_CREDENTIALS_PATH is set in .env and differs per machine, so
      # no path to anyone's home directory is committed.
      #
      # :ro because this container only ever reads it. A credential a process
      # can overwrite is a credential a compromised process can replace.
      - ${GOOGLE_CREDENTIALS_PATH:-./docker/noop-credentials.json}:/run/secrets/google-drive.json:ro
    ports: ["8082:8082"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/user/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  gatepass-service:
    build: ./gatepass-service
    container_name: perimity-gatepass
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gatepassdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      # gatepass-service/application.properties pins spring.rabbitmq.host to
      # localhost on purpose (so an STS run does not try to resolve "rabbitmq")
      # and documents that Docker must override it with SPRING_RABBITMQ_HOST.
      # RABBITMQ_HOST above is NOT read by that file, so without this line the
      # service dials localhost inside its own container, never connects, and
      # every pass sits at PENDING because qr.generate.request is never
      # published and qr.generate.result is never consumed.
      SPRING_RABBITMQ_HOST: rabbitmq
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CAMPUS_SERVICE_URL: http://campus-service:8084
      STORAGE_LOCAL_DIR: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
    ports: ["8083:8083"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/gatepass/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  campus-service:
    build: ./campus-service
    container_name: perimity-campus
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campusdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_LOCAL_DIR: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
    ports: ["8084:8084"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/campus/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  qr-service:
    build: ./qr-service
    container_name: perimity-qr
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qrdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      # Same SMTP_* override as auth-service. Both must agree: a pass email and
      # its OTP arriving from different senders is worse than neither working.
      MAIL_HOST: ${SMTP_HOST:-mailhog}
      MAIL_PORT: ${SMTP_PORT:-1025}
      MAIL_SMTP_AUTH: "${SMTP_AUTH:-false}"
      MAIL_STARTTLS: "${SMTP_STARTTLS:-false}"
      GATEPASS_SERVICE_URL: http://gatepass-service:8083
      QR_STORAGE_LOCAL_ROOT: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
    ports: ["8086:8086"]
    depends_on:
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/api/qr/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  guard-service:
    build: ./guard-service
    container_name: perimity-guard
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/entrylogdb
      QR_SERVICE_URL: http://qr-service:8086
      GATEPASS_SERVICE_URL: http://gatepass-service:8083
      CAMPUS_SERVICE_URL: http://campus-service:8084
      USER_SERVICE_URL: http://user-service:8082
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports: ["8085:8085"]
    depends_on:
      discovery-server: { condition: service_healthy }
      mongo: { condition: service_healthy }
    healthcheck:
      # guard-service is the only one with a real health endpoint, so its check
      # also reports whether the four services it calls are reachable.
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
volumes:
  perimity_storage:
  postgres_data:
  mongo_data:
  rabbitmq_data:
