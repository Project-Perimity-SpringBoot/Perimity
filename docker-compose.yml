# Perimity — local development stack.
#
# Reads values from .env in this folder. Copy .env.example to .env first.
#
#   cp .env.example .env
#   docker compose up --build
#
# The `version:` key was removed — Compose v2 ignores it and warns about it.
services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16
    container_name: perimity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates authdb, userdb, gatepassdb, campusdb, qrdb on first startup.
      # Without this, every service fails with "database ... does not exist".
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:7
    container_name: perimity-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3-management
    container_name: perimity-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: perimity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailhog:
    image: mailhog/mailhog:latest
    container_name: perimity-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 3s
      retries: 5
  # ---------- Application services ----------
#
# Paste these UNDER the existing infra services (postgres, mongo, rabbitmq,
# redis, mailhog) and DELETE the six commented-out blocks currently there.
#
# Two things differ from those commented blocks, both deliberate:
#
#  1. Ports map 8081:8081, not 8081:8080. Every service sets its own
#     server.port in application.properties (8081..8086). The old mapping
#     assumed 8080 inside the container, so nothing would have answered.
#
#  2. Service URLs use CONTAINER NAMES, not localhost. Inside the compose
#     network `localhost` is the container itself, so every cross-service call
#     would have connected to nothing. This is the single most common reason a
#     stack that works in an IDE fails in Docker.
#
# env_file supplies JWT_SECRET, INTERNAL_API_KEY, QR_AES_KEY and the database
# credentials from the repo-root .env, so no secret appears below.
# ============================================================================
  discovery-server:
    build: ./discovery-server
    container_name: perimity-discovery
    restart: unless-stopped
    env_file: .env
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  auth-service:
    build: ./auth-service
    container_name: perimity-auth
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/auth/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  user-service:
    build: ./user-service
    container_name: perimity-user
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      GATEPASS_BASE_URL: http://gatepass-service:8083
      STORAGE_LOCAL_DIR: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/user/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  gatepass-service:
    build: ./gatepass-service
    container_name: perimity-gatepass
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gatepassdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CAMPUS_SERVICE_URL: http://campus-service:8084
      STORAGE_LOCAL_DIR: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/gatepass/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  campus-service:
    build: ./campus-service
    container_name: perimity-campus
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campusdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_LOCAL_DIR: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/campus/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  qr-service:
    build: ./qr-service
    container_name: perimity-qr
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qrdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS: "false"
      GATEPASS_SERVICE_URL: http://gatepass-service:8083
      QR_STORAGE_LOCAL_ROOT: /storage
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - perimity_storage:/storage
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/api/qr/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  guard-service:
    build: ./guard-service
    container_name: perimity-guard
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/entrylogdb
      QR_SERVICE_URL: http://qr-service:8086
      GATEPASS_SERVICE_URL: http://gatepass-service:8083
      CAMPUS_SERVICE_URL: http://campus-service:8084
      USER_SERVICE_URL: http://user-service:8082
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports: ["8085:8085"]
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      # guard-service is the only one with a real health endpoint, so its check
      # also reports whether the four services it calls are reachable.
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
volumes:
  perimity_storage:
  postgres_data:
  mongo_data:
  rabbitmq_data: