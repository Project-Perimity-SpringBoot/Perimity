# =========================================================
#                     GUARD SERVICE
# =========================================================
spring.application.name=guard-service
server.port=8085

# =========================================================
#   MONGODB  -  values come from the environment.
#   docker-compose injects SPRING_DATA_MONGODB_URI from .env.
#   The value after ":" is a local-development fallback only.
# =========================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/entrylogdb}

# Spring Boot 3 does NOT create Mongo indexes automatically.
# Without this line every @Indexed and @CompoundIndex is silently ignored and
# the collection scans on every query. This is the single easiest thing to miss.
spring.data.mongodb.auto-index-creation=true

# =========================================================
#                   SWAGGER / OPENAPI
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
#            ERROR DETAIL  -  DEVELOPMENT ONLY
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
#            DAY 7  -  JWT (VERIFY ONLY)
# =========================================================
# Must be byte-identical to auth-service's value or no token issued there will
# validate here. No fallback on purpose: a service that falls back to a known
# string will happily accept tokens forged with the string that sits in Git.
#
# Set JWT_SECRET before running, or startup fails with a message telling you so:
#   Run > Run Configurations > GuardServiceApplication > Environment > New
perimity.jwt.secret=${JWT_SECRET:}

# Shared key guarding /api/internal/** - same value in all six services.
perimity.internal.api-key=${INTERNAL_API_KEY:}

# =========================================================
#            DAY 8  -  OUTBOUND SERVICE CALLS
# =========================================================
# Which PassVerificationClient and RunningEventClient to wire:
#   http  real calls to qr-service and gatepass-service (default, correct)
#   stub  development tokens, no network. Set this in your STS launch config
#         while waiting on the two endpoints below; never in a deployed env.
perimity.guard.clients=${GUARD_CLIENTS:http}

perimity.services.qr-url=${QR_SERVICE_URL:http://localhost:8086}
perimity.services.gatepass-url=${GATEPASS_SERVICE_URL:http://localhost:8083}

# 400ms per hop. A scan makes two, and FR-SCAN-3 allows one second total. This is
# the whole latency story until the Redis cache lands on Day 11.
perimity.services.timeout-ms=${INTERNAL_TIMEOUT_MS:400}
