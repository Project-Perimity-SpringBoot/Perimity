# =========================================================
#                     GUARD SERVICE
# =========================================================
spring.application.name=guard-service
server.port=8085

# =========================================================
#   READ THE REPO-ROOT .env, SO NOBODY HAND-ENTERS SECRETS
# =========================================================
# Every service in this project fails fast when JWT_SECRET or INTERNAL_API_KEY
# is missing - correctly, because a service that boots with an empty internal key
# is worse than one that refuses to start. The side effect was that running the
# stack meant typing the same secrets into six IDE launch configurations, and
# retyping them all whenever one rotated. That is friction that ends with someone
# hard-coding a value to make it stop.
#
# `.env` already exists at the repo root, is git-ignored, and holds exactly these
# values. KEY=VALUE is a valid properties file, so Boot can simply read it.
#
# `optional:` is what makes this safe in every environment: under Docker Compose
# and on AWS there is no ../.env and the real environment supplies the values, so
# this line does nothing. It only helps a developer running from an IDE.
#
# Order matters. spring.config.import is layered BELOW the actual environment, so
# a real environment variable still wins - .env is a fallback for local runs, not
# an override of deployment configuration.
spring.config.import=optional:file:../.env[.properties]

# =========================================================
#   MONGODB  -  values come from the environment.
#   docker-compose injects SPRING_DATA_MONGODB_URI from .env.
#   The value after ":" is a local-development fallback only.
# =========================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/entrylogdb}

# Spring Boot 3 does NOT create Mongo indexes automatically.
# Without this line every @Indexed and @CompoundIndex is silently ignored and
# the collection scans on every query. This is the single easiest thing to miss.
spring.data.mongodb.auto-index-creation=true

# =========================================================
#                   SWAGGER / OPENAPI
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
#            ERROR DETAIL  -  DEVELOPMENT ONLY
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
#            DAY 7  -  JWT (VERIFY ONLY)
# =========================================================
# Must be byte-identical to auth-service's value or no token issued there will
# validate here. No fallback on purpose: a service that falls back to a known
# string will happily accept tokens forged with the string that sits in Git.
#
# Set JWT_SECRET before running, or startup fails with a message telling you so:
#   Run > Run Configurations > GuardServiceApplication > Environment > New
perimity.jwt.secret=${JWT_SECRET:}

# Shared key guarding /api/internal/** - same value in all six services.
perimity.internal.api-key=${INTERNAL_API_KEY:}

# =========================================================
#            DAY 8/11  -  OUTBOUND SERVICE CALLS
# =========================================================
# Three switches, not one. The original single GUARD_CLIENTS flag turned all of
# them at once, which was wrong the moment the three dependencies stopped
# arriving together: Tushar's running-event lookup exists, Sanjay's /decrypt does
# not, and Arham's config key is still named something else. One flag meant real
# Behavior 2 could not be used until the slowest of the three landed.
#
#   http  real service call
#   stub  no network - dev tokens, no event, documented config default
#
# Each falls back to GUARD_CLIENTS, so the one env var still switches everything
# for anyone who does not care about the distinction.
perimity.guard.clients.verification=${GUARD_CLIENTS_VERIFICATION:${GUARD_CLIENTS:http}}
perimity.guard.clients.events=${GUARD_CLIENTS_EVENTS:${GUARD_CLIENTS:http}}
perimity.guard.clients.campus=${GUARD_CLIENTS_CAMPUS:${GUARD_CLIENTS:http}}
perimity.guard.clients.profile=${GUARD_CLIENTS_PROFILE:${GUARD_CLIENTS:http}}

perimity.services.qr-url=${QR_SERVICE_URL:http://localhost:8086}
perimity.services.gatepass-url=${GATEPASS_SERVICE_URL:http://localhost:8083}
perimity.services.campus-url=${CAMPUS_SERVICE_URL:http://localhost:8084}
perimity.services.user-url=${USER_SERVICE_URL:http://localhost:8082}

# 400ms per hop. A scan makes two on the hot path, and FR-SCAN-3 allows one
# second total. This is the whole latency story until Redis caches active passes.
perimity.services.timeout-ms=${INTERNAL_TIMEOUT_MS:400}

# repeat_entry_result changes about twice a year. Reading it per scan would be
# the slowest way to learn something almost always identical to last time.
perimity.services.config-cache-seconds=${CONFIG_CACHE_SECONDS:300}

# =========================================================
#            DAY 12  -  HEALTH (SRS 5.6)
# =========================================================
# Only health is exposed. Actuator's other endpoints - env, beans, mappings,
# configprops - would publish this service's configuration, including which
# secrets are set, to anyone who can reach the port.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Mongo reachability, free from actuator. The four HTTP dependencies are added
# by DownstreamHealthConfig.
management.health.mongo.enabled=true

# =========================================================
#         SERVICE DISCOVERY  -  Eureka client
# =========================================================
# The service registers under spring.application.name, which is already set
# above. Feign then resolves @FeignClient(name = "campus-service") through the
# registry, so no URL appears in the code.
#
# ENABLED=false is a first-class option, not a bug workaround. With it off the
# service behaves exactly as it did before Eureka existed and falls back to the
# plain <PEER>_SERVICE_URL properties. That means the registry being down never
# stops the platform, and a teammate can run one service without starting it.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Register by IP rather than hostname. On a laptop the hostname often does not
# resolve from another process, and the registry then holds an address nobody
# can reach.
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}

# Faster than the 30s default, so a service you just started appears in the
# dashboard while you are still looking at it. Leave the defaults in production.
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Eureka is chatty. This keeps the console readable.
logging.level.com.netflix.discovery=WARN

# =========================================================
#         FEIGN  -  declarative peer calls
# =========================================================
# Which client implementation is live. Both are present; this chooses.
#   http   RestClient, the original. Still the default.
#   feign  the Feign implementation, resolved through Eureka.
# One property, and rollback is changing it back.
perimity.clients.mode=${CLIENTS_MODE:http}

# Timeouts. Feign's defaults are 10s connect and 60s read, which is far too
# long for a call that only enriches a QR job - it would hold a request thread
# for a minute while a peer is restarting.
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Required for the 'fallback' attribute on @FeignClient to be honoured. Without
# this Feign throws on failure and the fail-soft behaviour is silently lost.
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=60
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=20s
