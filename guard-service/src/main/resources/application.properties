# =========================================================
#                     GUARD SERVICE
# =========================================================
spring.application.name=guard-service
server.port=8085

# =========================================================
#   MONGODB  -  values come from the environment.
#   docker-compose injects SPRING_DATA_MONGODB_URI from .env.
#   The value after ":" is a local-development fallback only.
# =========================================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/entrylogdb}

# Spring Boot 3 does NOT create Mongo indexes automatically.
# Without this line every @Indexed and @CompoundIndex is silently ignored and
# the collection scans on every query. This is the single easiest thing to miss.
spring.data.mongodb.auto-index-creation=true

# =========================================================
#                   SWAGGER / OPENAPI
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
#            ERROR DETAIL  -  DEVELOPMENT ONLY
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
#            DAY 7  -  JWT (VERIFY ONLY)
# =========================================================
# Must be byte-identical to auth-service's value or no token issued there will
# validate here. No fallback on purpose: a service that falls back to a known
# string will happily accept tokens forged with the string that sits in Git.
#
# Set JWT_SECRET before running, or startup fails with a message telling you so:
#   Run > Run Configurations > GuardServiceApplication > Environment > New
perimity.jwt.secret=${JWT_SECRET:}

# Shared key guarding /api/internal/** - same value in all six services.
perimity.internal.api-key=${INTERNAL_API_KEY:}

# =========================================================
#            DAY 8/11  -  OUTBOUND SERVICE CALLS
# =========================================================
# Three switches, not one. The original single GUARD_CLIENTS flag turned all of
# them at once, which was wrong the moment the three dependencies stopped
# arriving together: Tushar's running-event lookup exists, Sanjay's /decrypt does
# not, and Arham's config key is still named something else. One flag meant real
# Behavior 2 could not be used until the slowest of the three landed.
#
#   http  real service call
#   stub  no network - dev tokens, no event, documented config default
#
# Each falls back to GUARD_CLIENTS, so the one env var still switches everything
# for anyone who does not care about the distinction.
perimity.guard.clients.verification=${GUARD_CLIENTS_VERIFICATION:${GUARD_CLIENTS:http}}
perimity.guard.clients.events=${GUARD_CLIENTS_EVENTS:${GUARD_CLIENTS:http}}
perimity.guard.clients.campus=${GUARD_CLIENTS_CAMPUS:${GUARD_CLIENTS:http}}
perimity.guard.clients.profile=${GUARD_CLIENTS_PROFILE:${GUARD_CLIENTS:http}}

perimity.services.qr-url=${QR_SERVICE_URL:http://localhost:8086}
perimity.services.gatepass-url=${GATEPASS_SERVICE_URL:http://localhost:8083}
perimity.services.campus-url=${CAMPUS_SERVICE_URL:http://localhost:8084}
perimity.services.user-url=${USER_SERVICE_URL:http://localhost:8082}

# 400ms per hop. A scan makes two on the hot path, and FR-SCAN-3 allows one
# second total. This is the whole latency story until Redis caches active passes.
perimity.services.timeout-ms=${INTERNAL_TIMEOUT_MS:400}

# repeat_entry_result changes about twice a year. Reading it per scan would be
# the slowest way to learn something almost always identical to last time.
perimity.services.config-cache-seconds=${CONFIG_CACHE_SECONDS:300}
