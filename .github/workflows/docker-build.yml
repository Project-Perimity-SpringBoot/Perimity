name: Build and check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # Fails the build if institution-specific branding or an obvious secret is
  # committed. Perimity is campus-agnostic: campus names come from the database,
  # never from code.
  guard-rails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: No institution branding in source
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=docs \
               --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist \
               --exclude=docker-build.yml \
               --exclude=package-lock.json --exclude='*.lock' \
               -iE 'c-?dac' . ; then
            echo "::error::Institution-specific branding found. Perimity is campus-agnostic."
            exit 1
          fi
          echo "Clean."

      - name: No committed .env file
        run: |
          if [ -f .env ]; then
            echo "::error::.env is committed. Remove it and keep only .env.example."
            exit 1
          fi
          echo "Clean."

  build:
    runs-on: ubuntu-latest
    needs: guard-rails
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - gatepass-service
          - campus-service
          - guard-service
          - qr-service
          - frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check if this service has a Dockerfile yet
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for ${{ matrix.service }}
        if: steps.check.outputs.exists == 'true'
        run: docker build -t perimity/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

      - name: No Dockerfile yet, skipping
        if: steps.check.outputs.exists == 'false'
        run: echo "${{ matrix.service }} has no Dockerfile yet, nothing to build."
