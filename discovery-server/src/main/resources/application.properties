spring.application.name=discovery-server
server.port=8761

# =========================================================
#   The registry does not register with itself
# =========================================================
# Both false because this IS the registry. Leaving them true makes Eureka try
# to replicate with a peer that does not exist, and the startup log fills with
# connection errors that look alarming and mean nothing.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# =========================================================
#   Self-preservation OFF for development
# =========================================================
# Self-preservation stops Eureka evicting instances when it loses too many
# heartbeats at once, on the assumption the network is at fault rather than the
# services. On a laptop where you stop and start services constantly, that means
# the dashboard keeps showing services that died ten minutes ago.
#
# TURN THIS BACK ON IN PRODUCTION. On real infrastructure a network blip really
# is more likely than every service dying simultaneously.
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=15000

# Quieter startup. Eureka is chatty by default.
logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN

management.endpoints.web.exposure.include=health,info
